name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  check:
    name: Lint, security scan, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --dev --deploy

      - name: Format (black)
        run: pipenv run black --check .

      - name: Lint (flake8)
        run: pipenv run flake8

      - name: Security scan (bandit)
        run: pipenv run bandit -q -r undiscriminate scripts -x "*/tests/*"

      - name: Migrations are up to date
        working-directory: undiscriminate
        run: pipenv run python manage.py makemigrations --check --dry-run

      - name: Production settings pass Django's deploy checks
        working-directory: undiscriminate
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: example.com
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export PSEUDONYM_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          pipenv run python manage.py check --deploy --fail-level WARNING

      - name: Tests
        run: pipenv run pytest --cov=undiscriminate --cov-report=term-missing --cov-fail-under=90

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t undiscriminating-discriminator:ci .
